---
# Copy SQL Server logs from the guests to the machine running ansible-playbook.
# Each file is saved as <mssql_logs_dest>/<host>/<path on the guest>.
#
# Usage examples:
#   ansible-playbook playbooks/mssql-collect-logs.yml --limit ubuntu2204-sql2022 -e mssql_logs_dest=/tmp/guest-logs
#
- name: collect SQL Server logs from MSSQL Linux hosts
  hosts: mssql_install_targets:mssql_manage_targets:&linux
  become: true
  gather_facts: false

  tasks:
    - name: find the SQL Server logs
      ansible.builtin.find:
        paths: /var/opt/mssql/log
        patterns:
          - errorlog*
          - sqlagent*
        file_type: file
      register: mssql_collect_found

    - name: fetch the SQL Server logs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ mssql_logs_dest }}/"
      loop: "{{ mssql_collect_found.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: collect SQL Server logs from MSSQL Windows hosts
  hosts: mssql_install_targets:mssql_manage_targets:&windows
  gather_facts: false

  tasks:
    - name: find the engine error logs and setup summaries
      ansible.windows.win_find:
        paths: C:\Program Files\Microsoft SQL Server
        patterns:
          - ERRORLOG*
          - Summary.txt
          - Detail.txt
        recurse: true
      register: mssql_collect_found

    - name: copy the files with shared read access
      ansible.windows.win_shell: |
        $root = 'C:\Windows\Temp\mssql-collect'
        Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
        foreach ($src in $env:COLLECT_PATHS -split '\|') {
          $dest = Join-Path $root $src.Substring(3)
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          # The live ERRORLOG is held open by SQL Server, so a plain copy or fetch fails
          $in = [IO.File]::Open($src, 'Open', 'Read', 'ReadWrite,Delete')
          $out = [IO.File]::Create($dest)
          $in.CopyTo($out)
          $out.Close()
          $in.Close()
        }
      environment:
        COLLECT_PATHS: "{{ mssql_collect_found.files | map(attribute='path') | join('|') }}"
      changed_when: false
      when: mssql_collect_found.files | length > 0

    - name: fetch the copied files
      ansible.builtin.fetch:
        src: "C:\\Windows\\Temp\\mssql-collect\\{{ item.path[3:] }}"
        dest: "{{ mssql_logs_dest }}/"
      loop: "{{ mssql_collect_found.files }}"
      loop_control:
        label: "{{ item.path }}"
