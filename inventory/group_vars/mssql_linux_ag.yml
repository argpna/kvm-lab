linux_sql_server:
  state: present
  version: "{{ sql_version | default(2022) }}"
  accept_eula: true
  edition: Developer
  sa_password: "{{ lab_password }}"
  enable_agent: true
  hadr_enabled: true
  install_tools: true
  install_ha_agent: true
  tcp_port: 1433
  hadr_endpoint_port: 5022
  manage_firewall: true
  ad_auth:
    enabled: true
    account_password: "{{ lab_password }}"
    accounts:
      lnx-cluster-n01: sql-cluster-n01
      lnx-cluster-n02: sql-cluster-n02

mssql:
  cluster:
    name: linuxcl01
    hacluster_password: "{{ lab_password }}"
    # openssl passwd -6 -salt mssqllabhacluster 'Zq7-Hm2-Xr9-Tw4!'
    hacluster_password_hash: "$6$mssqllabhacluste$JUpBkO0MyxsndVFgKIUjNoci.iMtwbSlS76SyJ187BVsu3oRrRVMwECIg3PHomvuN3y.xFm1qDx9agC5Ay6iy."  # noqa yaml[line-length]
    sql_login:
      manage: true
      name: pacemaker
      password: "{{ lab_password }}"
      secrets_file: /var/opt/mssql/secrets/passwd
  ag:
    name: aglinux01
    cluster_type: external
  topology:
    mode: multi_subnet
    nodes:
      - lnx-cluster-n01
      - lnx-cluster-n02
    node_subnets:
      lnx-cluster-n01: 192.168.131.0/24
      lnx-cluster-n02: 192.168.132.0/24
